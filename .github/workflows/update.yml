name: Update Tingsaker homework

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # 07:15 Oslo in summer time, 06:15 in winter time.
    # The workflow itself uses Europe/Oslo when generating data.
    - cron: "15 5 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  update:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch latest published weekly plan
        run: python update_feed.py --out data.json
      - name: Normalize generated feed
        run: python normalize_data.py data.json
      - name: Validate generated feed
        run: |
          python -m json.tool data.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data.json").read_text(encoding="utf-8"))
          assert data["grade_1"]["label"] == "1. klasse"
          assert data["grade_4b"]["label"] == "4. klasse"
          assert "today_homework" in data["grade_4b"]
          assert "next_homework" in data["grade_4b"]
          assert not ({"today_day", "today_homework", "next_day", "next_homework", "homework", "notes", "source"} & data.keys())
          if data["grade_1"]["today_day"] == "fredag":
              assert data["grade_1"]["next_day"] == "helg"
              assert data["grade_1"]["next_homework"] == ""
          print("data.json OK:")
          print("  uke:", data["grade_1"]["week"])
          print("  1. klasse:", data["grade_1"]["today_day"], repr(data["grade_1"]["today_homework"]))
          print("  4. klasse:", data["grade_4b"]["today_day"], repr(data["grade_4b"]["today_homework"]))
          print("  neste:", data["grade_1"]["next_day"], repr(data["grade_1"]["next_homework"]))
          print("  4B neste:", data["grade_4b"]["next_day"], repr(data["grade_4b"]["next_homework"]))
          PY
      - name: Commit feed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update homework feed"
          git push

  audit-4b-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Audit every available 4B archive week
        run: |
          python - <<'PY'
          from update_feed import ARCHIVE_4B_URL, archive_links, extract_4b_sections, extract_text, fetch

          html = fetch(ARCHIVE_4B_URL).decode("utf-8", errors="replace")
          links = archive_links(html, ARCHIVE_4B_URL)
          unique = {item["url"]: item for item in links}
          if not unique:
              raise SystemExit("FEIL: Fant ingen ukeplaner i 4B-arkivet")

          failures = []
          print(f"Fant {len(unique)} ukeplandokumenter i 4B-arkivet")
          for item in sorted(unique.values(), key=lambda x: (x["week"], x["url"])):
              label = f"uke {item['week']} — {item['url']}"
              try:
                  raw = fetch(item["url"])
                  text = extract_text(item["url"], raw, layout=True)
                  parsed = extract_4b_sections(text)
                  homework_days = [d for d, v in parsed["homework"].items() if v]
                  reminder_days = [d for d, v in parsed["reminders"].items() if v]
                  if not homework_days and not reminder_days:
                      raise ValueError("parseren fant ingen lekser eller Husk-tekst")
                  print(f"OK: {label}; lekser={homework_days}; husk={reminder_days}")
              except Exception as exc:
                  failures.append((label, str(exc)))
                  print(f"FEIL: {label}: {exc}")

          print(f"\nResultat: {len(unique) - len(failures)}/{len(unique)} dokumenter bestått")
          if failures:
              print("Dokumenter som må undersøkes:")
              for label, error in failures:
                  print(f"- {label}: {error}")
              raise SystemExit(1)
          PY

  audit-grade-1-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Audit every available first-grade archive week
        run: |
          python - <<'PY'
          from update_feed import ARCHIVE_URL, archive_links, extract_homework, extract_notes, extract_text, fetch

          html = fetch(ARCHIVE_URL).decode("utf-8", errors="replace")
          links = archive_links(html, ARCHIVE_URL)
          unique = {item["url"]: item for item in links}
          if not unique:
              raise SystemExit("FEIL: Fant ingen ukeplaner i 1. klasse-arkivet")

          failures = []
          print(f"Fant {len(unique)} ukeplandokumenter i 1. klasse-arkivet")
          for item in sorted(unique.values(), key=lambda x: (x["week"], x["url"])):
              label = f"uke {item['week']} — {item['url']}"
              try:
                  raw = fetch(item["url"])
                  text = extract_text(item["url"], raw)
                  homework = extract_homework(text)
                  notes = extract_notes(text)
                  homework_days = [d for d, v in homework.items() if v]
                  note_days = [d for d, v in notes.items() if v]
                  print(f"OK: {label}; lekser={homework_days}; informasjon={note_days}")
              except Exception as exc:
                  failures.append((label, str(exc)))
                  print(f"FEIL: {label}: {exc}")

          print(f"\nResultat: {len(unique) - len(failures)}/{len(unique)} dokumenter bestått")
          if failures:
              print("Dokumenter som må undersøkes:")
              for label, error in failures:
                  print(f"- {label}: {error}")
              raise SystemExit(1)
          PY
