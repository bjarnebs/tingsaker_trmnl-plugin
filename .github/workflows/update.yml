name: Update Tingsaker homework

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # 07:15 Oslo in summer time, 06:15 in winter time.
    # The workflow itself uses Europe/Oslo when generating data.
    - cron: "15 5 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  update:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch latest published weekly plan
        run: python update_feed.py --out data.json
      - name: Validate generated feed
        run: python -m json.tool data.json >/dev/null
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update homework feed"
          git push
