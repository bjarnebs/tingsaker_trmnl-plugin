name: Repair mislabelled 4B week

on:
  workflow_run:
    workflows: ["Update Tingsaker homework"]
    types: [completed]
  workflow_dispatch:

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Detect and repair likely mislabelled 4B week
        run: python detect_4b_week.py --data data.json --week "$(date -u +%V)"
      - name: Commit repaired feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Repair mislabelled 4B week"
          git push
